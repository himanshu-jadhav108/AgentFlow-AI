version: '3.8'

services:
  agent-api:
    build:
      context: .
      target: runner
    container_name: agentflow_api_service
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - PORT=8000
      - HOST=0.0.0.0
      - LLM_PROVIDER=huggingface
      - LLM_MODEL_NAME=Qwen/Qwen2.5-0.5B-Instruct
      - HF_HOME=/root/.cache/huggingface
    volumes:
      # Persists HuggingFace downloads across container rebuilds
      - huggingface_cache:/root/.cache/huggingface
      # Persists vector database FAISS indexes across builds
      - vector_data:/app/data/vectorstore
      # Persists log dumps
      - logs_data:/app/logs
    restart: unless-stopped

volumes:
  huggingface_cache:
    driver: local
  vector_data:
    driver: local
  logs_data:
    driver: local
